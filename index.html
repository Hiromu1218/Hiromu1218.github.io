<!DOCTYPE html>
<html lang="jp">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ページ作成者 -->
    <meta name="author" content="Hiromu Kato">
    <!-- ページ内容を表すキーワード（3〜5つくらい） -->
    <meta name="keywords" content="javascript, ライブラリ, jquery, chart.js">

    <!-- CSSとの紐づけ、CSSへのパスは相対パスで記述する -->
    <link rel="stylesheet" href="./css/main.css">

    <title>kadai-final</title>
</head>

<body>

    <div class="container">
        <header>
            <h1 id="top">最終課題</h1>
        </header>

        <main>
            <section>
                <h2>jQuery</h2>

                <div>
                    <section>
                        <h3>セレクタ</h3>
                        <div>
                            <p id="test-p-1">リンゴ</p>
                            <p class="test-p-2">バナナ</p>
                            <p id="test-p-3">パイナップル</p>
                        </div>
                    </section>

                    <section>
                        <h3>メソッド</h3>
                        <div>
                            <button type="button" onclick="toggle1()">表示</button>
                            <button type="button" onclick="toggle2()">非表示</button>
                            <button type="button" onclick="slide()">スライドダウン</button>
                            <button type="button" onclick="slide2()">スライドアップ</button>
                            <button type="button" onclick="fade()">フェードイン</button>
                            <button type="button" onclick="fade2()">フェードアウト</button>
                            <button type="button" onclick="color()">CSS操作</button>
                        </div>
                    </section>

                    <section>
                        <h3>イベントハンドラ</h3>
                        <div>
                            <form action="">
                                <input id="input-1" type="text">
                            </form>
                        </div>
                    </section>
                </div>

            </section>

            <section>
                <h2>Chart.js</h2>

                <section>
                    <h3>動物園・水族館で一番好きな生き物TOP5 棒グラフ</h3>
                    <canvas id="myChart1"></canvas>
                </section>

                <section>
                    <h3>動物園・水族館で一番好きな生き物TOP5 ドーナツグラフ</h3>
                    <canvas id="myChart2"></canvas>
                </section>

            </section>
        </main>

        <footer>
            Copyright &copy; Hiromu Kato, All Rights Reserved.
            <br>
            ＜参考文献＞
            https://spring.walkerplus.com/gw/topics/article/1077025/
        </footer>
    </div>

    <!-- 外部のjavascriptを読み込む -->
    <!-- 読み込む順番が重要 -->
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- 自分のjavascriptファイル -->
    <script src="./js/jquery-test.js"></script>
    <script src="./js/chart-test.js"></script>

</body>
